name: Release albumfetch

# This workflow only triggers when you push a tag like 'v1.0.0'
on:
  push:
    tags:
      - 'v*'

jobs:
  # ==========================================
  # JOB 1: Run the Docker Test Matrix
  # ==========================================
  test:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Docker Compose Suite
        working-directory: ./tests
        # The --abort-on-container-exit flag is crucial here. 
        # It forces the CI step to fail immediately if any single distro test fails.
        run: docker compose up --build --abort-on-container-exit

        # ==========================================
        # JOB 2: Build the Release Binaries
        # ==========================================
  build:
    name: Compile Binaries
    needs: test # Only runs if the tests pass
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Cross-compile targets for Linux and macOS
        target:
          - x86_64-linux-musl
          - aarch64-linux-musl
          - x86_64-macos-none
          - aarch64-macos-none

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Read Zig version
        run: echo "ZIG_VER=$(cat .zig-version)" >> $GITHUB_ENV

      - name: Install Zig
        run: |
          ZIG_URL=$(curl -s https://ziglang.org/download/index.json | jq -r ".[\"${{ env.ZIG_VER }}\"][\"x86_64-linux\"][\"tarball\"]")
          curl -o zig.tar.xz $ZIG_URL
          mkdir -p $HOME/zig
          tar -xf zig.tar.xz -C $HOME/zig --strip-components=1
          echo "$HOME/zig" >> $GITHUB_PATH

      - name: Build binary
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe

      - name: Package Tarball
        run: |
          mkdir -p release
          tar -czvf release/albumfetch-${{ matrix.target }}.tar.gz -C zig-out/bin albumfetch

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: albumfetch-${{ matrix.target }}
          path: release/*.tar.gz

          # ==========================================
          # JOB 3: Publish the GitHub Release
          # ==========================================
  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz
          generate_release_notes: true

  update-homebrew:
    name: Update Homebrew Formula
    needs: release # Waits for the GitHub Release to be published
    runs-on: ubuntu-latest
    steps:
      - name: Bump Homebrew formula
        uses: mislav/bump-homebrew-formula-action@v3
        with:
          # The name of your formula file
          formula-name: albumfetch
          # The repository where your tap lives (e.g., your-username/homebrew-tap)
          homebrew-tap: StuffedRat46810/homebrew-tap
          download-url: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/albumfetch-x86_64-macos-none.tar.gz
          commit-message: "brew: bump albumfetch to ${{ github.ref_name }}"
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_BUMP_TOKEN }}
  update-aur:
    name: Update AUR Package
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v3.0.1
        with:
          pkgname: albumfetch-bin
          pkgbuild: ./PKGBUILD # Path to the PKGBUILD inside your repo
          commit_username: ${{ github.actor }}
          commit_email: ${{ github.actor }}@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "aur: bump version to ${{ github.ref_name }}"
          # The action can automatically run updpkgsums to hash your new musl release
          updpkgsums: true
